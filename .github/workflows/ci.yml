name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GOWORK: "off"

jobs:
  test:
    runs-on: ubuntu-latest
    # The race detector needs cgo at test time; the library itself stays
    # CGO-free, which the cross-build job proves with CGO_ENABLED=0.
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - name: Gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needs to be run on:"
            echo "$out"
            exit 1
          fi
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      - name: Test with coverage (race)
        run: go test -race -covermode=atomic -coverprofile=cover.out ./...
      - name: Enforce 100% coverage
        run: |
          go tool cover -func=cover.out
          # ⛔ The PROFILE, not the percentage. "total: 99.95%" prints as
          # 100.0%, so a gate reading the rounded figure passes with blocks
          # nobody ran. Every line of a profile ends in its hit count, so an
          # uncovered block is a line ending in " 0".
          zero=$(grep -c ' 0$' cover.out || true)
          echo "uncovered blocks: $zero"
          if [ "$zero" -ne 0 ]; then
            grep ' 0$' cover.out
            exit 1
          fi

  cross-build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - linux/riscv64
          - linux/ppc64le
          - linux/s390x
          - linux/loong64
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
          - js/wasm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - name: Build ${{ matrix.target }}
        run: |
          export GOOS=$(echo "${{ matrix.target }}" | cut -d/ -f1)
          export GOARCH=$(echo "${{ matrix.target }}" | cut -d/ -f2)
          go build ./...
