name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GOWORK: "off"

# Least privilege, named rather than inherited. Reported by `wfaudit`: with no
# permissions declared, every job received the repository's DEFAULT token —
# read-only or read-write by an organisation setting this file cannot show,
# which put "what can a job here reach" somewhere no reviewer of this file
# could read. Nothing below writes.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The race detector needs cgo at test time; the library itself stays
    # CGO-free, which the cross-build job proves with CGO_ENABLED=0.
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      # go.mod and not a hard-coded version, which `gofloor` reports as a
      # finding: a lane pinned beside a go.mod drifts from it silently, and
      # the toolchain decides every standard-library finding.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needs to be run on:"
            echo "$out"
            exit 1
          fi
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      - name: Test with coverage (race)
        run: go test -race -covermode=atomic -coverprofile=cover.out ./...
      - name: Enforce 100% coverage
        run: |
          go tool cover -func=cover.out
          # ⛔ THE PROFILE, NOT THE PERCENTAGE. "total: 99.95%" prints as
          # 100.0%, so a gate reading the rounded figure passes with blocks
          # nobody ran.
          #
          # ⛔ And the test is NOT a grep for a trailing zero, which is what
          # this gate used to be. A profile line is
          # `file:from,to numStatements hitCount`, and a package whose types
          # carry marker methods has lines ending in " 0 0": zero statements,
          # zero hits. Those are EMPTY blocks, not unrun ones, and the grep
          # fails a package for having them -- measured on go-richdoc/richdoc,
          # where twenty-two of them are what make Block and Inline closed
          # sets.
          uncovered=$(awk '$NF == 0 && $(NF-1) > 0' cover.out)
          if [ -n "$uncovered" ]; then
            echo "::error::these blocks were never entered"
            echo "$uncovered"
            exit 1
          fi
          echo "every block with a statement in it was entered"

  vulns:
    # The organisation's lane, defined once in go-richdoc/.github and called
    # here. It runs govulncheck and hands the stream to vulngate rather than
    # believing an exit status that answers a different question, and it scans
    # under this repository's own go.mod. See that file for the measurements
    # that put it there.
    uses: go-richdoc/.github/.github/workflows/vulns.yml@main

  cross-build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      # ⛔ goos and goarch SEPARATELY, not one "linux/amd64" string split in
      # the shell. The step used to do
      #
      #     export GOOS=$(echo "${{ matrix.target }}" | cut -d/ -f1)
      #
      # which actionlint reports as SC2155: `export X=$(...)` masks the
      # pipeline's exit status, so a failed split leaves GOOS empty and `go
      # build` silently builds for the HOST while the job reports that it
      # cross-built for s390x. Nothing here had an actionlint lane, so nobody
      # saw it. The matrix carries the two values, GitHub substitutes them into
      # the environment, and no shell parses anything.
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: linux, goarch: loong64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: js, goarch: wasm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...
